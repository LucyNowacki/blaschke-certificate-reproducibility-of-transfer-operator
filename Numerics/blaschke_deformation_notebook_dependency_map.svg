  <text class="dep-small" x="923" y="1683">24 Schur counts; 17 Schur moats; 7 Laurent moats</text>
  <text class="dep-small" x="923" y="1706">total certified algebraic multiplicity 30</text>
  <path class="dep-theorem-arrow" d="M875 1676 H900"/>
  <path class="dep-theorem-arrow" d="M1355 1606 V1627"/>
