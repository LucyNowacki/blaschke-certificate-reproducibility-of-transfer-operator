  <path class="dep-provenance-arrow" d="M840 171 H885"/>
  <path class="dep-provenance-arrow" d="M1240 171 H1195"/>

  <rect class="dep-setup" x="40" y="270" width="1515" height="145" rx="7"/>
  <text class="dep-section dep-blue" x="60" y="301">Setup and benchmark lock: Cells 1M--12N</text>
  <rect class="dep-cell" x="60" y="318" width="430" height="72" rx="5"/>
  <text class="dep-label" x="78" y="344">Scope, Perron--Frobenius convention and phases</text>
  <text class="dep-small" x="78" y="368">Cells 1M--4M; map label blaschke_mu_0p3</text>
  <rect class="dep-cell" x="535" y="318" width="420" height="72" rx="5"/>
  <text class="dep-label" x="553" y="344">Imports, paths and fixed configuration</text>
