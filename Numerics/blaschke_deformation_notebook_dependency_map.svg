  <path class="dep-solid" d="M860 825 H890"/>
  <rect class="dep-phase2" x="475" y="888" width="175" height="62" rx="5"/>
  <text class="dep-small" x="493" y="912">54N Cell 24B</text>
  <text class="dep-micro" x="493" y="934">resolved-response helper</text>
  <rect class="dep-phase2" x="685" y="888" width="175" height="62" rx="5"/>
  <text class="dep-small" x="703" y="912">55N Cell 24C</text>
  <text class="dep-micro" x="703" y="934">input plus final aggregation</text>
  <rect class="dep-phase2" x="895" y="888" width="160" height="62" rx="5"/>
  <text class="dep-small" x="913" y="912">59N output</text>
  <text class="dep-micro" x="913" y="934">analytic leakage</text>
  <path class="dep-solid" d="M975 852 V883"/>
  <path class="dep-solid" d="M772 852 V883"/>
  <path class="dep-solid" d="M562 852 V883"/>
