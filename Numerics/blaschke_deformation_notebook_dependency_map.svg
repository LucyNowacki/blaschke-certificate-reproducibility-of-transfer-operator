  <text class="dep-title" x="45" y="53">Effective cell, helper and dataset dependency graph</text>
  <line class="dep-solid" x1="760" y1="47" x2="820" y2="47"/>
  <text class="dep-small" x="830" y="52">theorem or data</text>
  <line class="dep-diagnostic-arrow" x1="1030" y1="47" x2="1090" y2="47"/>
  <text class="dep-small" x="1100" y="52">diagnostic only</text>
  <line class="dep-provenance-arrow" x1="1300" y1="47" x2="1360" y2="47"/>
  <text class="dep-small" x="1370" y="52">build or provenance</text>

  <rect class="dep-band" x="40" y="78" width="1515" height="165" rx="8"/>
  <text class="dep-section" x="60" y="108">Reproducibility envelope</text>
  <rect class="dep-data" x="60" y="125" width="310" height="92" rx="6"/>
  <text class="dep-label" x="78" y="151">Locked notebook sources</text>
  <text class="dep-small" x="78" y="176">certifier_template.ipynb</text>
  <text class="dep-small" x="78" y="198">certifier.ipynb</text>
  <rect class="dep-data" x="420" y="125" width="420" height="92" rx="6"/>
  <text class="dep-label" x="438" y="151">Builder and curation contracts</text>
  <text class="dep-small" x="438" y="176">build_*_thesis_math_notebook.py</text>
  <text class="dep-small" x="438" y="198">dependency-map source, provenance and plotting maps</text>
  <rect class="dep-data" x="890" y="125" width="300" height="92" rx="6"/>
  <text class="dep-label" x="908" y="151">Executed final notebook</text>
  <text class="dep-small" x="908" y="176">Cell 0M, inherited Cells 1M--109N, final Cell 110M</text>
  <text class="dep-small" x="908" y="198">141 cells; 68 code cells; 18 inline helpers</text>
  <rect class="dep-data" x="1240" y="125" width="295" height="92" rx="6"/>
  <text class="dep-label" x="1258" y="151">Locks and verification</text>
  <text class="dep-small" x="1258" y="176">conda and pip locks; focused tests</text>
  <text class="dep-small" x="1258" y="198">MANIFEST.sha256; archive verifier</text>
