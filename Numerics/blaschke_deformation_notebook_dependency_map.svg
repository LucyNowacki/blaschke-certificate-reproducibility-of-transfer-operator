  <rect class="dep-result" x="180" y="1802" width="1240" height="56" rx="7"/>
  <text class="dep-label dep-magenta" x="210" y="1836">Certified conclusion: N=600, M=610; 24 nontrivial Riesz packets; algebraic multiplicity 30</text>
