  <text class="dep-label" x="78" y="778">Inline helper stack</text>
  <text class="dep-small" x="78" y="802">35AN  phase2_geometry.py</text>
  <text class="dep-small" x="78" y="826">35BN  phase2_transport.py</text>
  <text class="dep-small" x="78" y="850">35CN  phase2_matrix.py</text>
  <text class="dep-small" x="78" y="874">35DN  phase2_pipeline.py</text>
  <text class="dep-small" x="78" y="898">48AN  phase2_finite_m.py</text>
  <text class="dep-small" x="78" y="922">52AN  phase2_resolved_response.py</text>
  <text class="dep-small" x="78" y="946">54AN  phase2_final_aggregation.py</text>
  <text class="dep-small" x="78" y="970">52N   deformation_certification.py</text>
