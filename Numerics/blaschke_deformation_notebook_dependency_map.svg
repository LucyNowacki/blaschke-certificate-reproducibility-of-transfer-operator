<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1900" width="100%" role="img" aria-labelledby="dependency-map-title dependency-map-description">
  <title id="dependency-map-title">Dependency graph for the Blaschke deformation thesis certifier</title>
  <desc id="dependency-map-description">The graph connects the notebook build chain, setup cells, four numerical phases, inline helper modules, persisted datasets, diagnostics, theorem-facing matrix and contour certificates, and reproducibility checks.</desc>
  <defs>
    <marker id="arrow-solid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-theorem" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-diagnostic" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-provenance" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .dep-frame { fill:#f8fafc; stroke:#64748b; stroke-width:2; }
      .dep-band { fill:#ffffff; stroke:#94a3b8; stroke-width:2; }
      .dep-setup { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
      .dep-phase1 { fill:#eef6ff; stroke:#1d4ed8; stroke-width:2; }
      .dep-phase2 { fill:#ecfdf5; stroke:#047857; stroke-width:2; }
      .dep-phase3 { fill:#fffbeb; stroke:#b45309; stroke-width:2; }
      .dep-diagnostic { fill:#fff7ed; stroke:#c2410c; stroke-width:2; stroke-dasharray:9 6; }
      .dep-theorem { fill:#f5f3ff; stroke:#6d28d9; stroke-width:3; }
      .dep-result { fill:#fdf2f8; stroke:#be185d; stroke-width:3; }
      .dep-data { fill:#f8fafc; stroke:#64748b; stroke-width:1.7; }
      .dep-cell { fill:#ffffff; stroke:#64748b; stroke-width:1.4; }
      .dep-title { font-family:system-ui,sans-serif; font-size:24px; font-weight:700; fill:#0f172a; }
      .dep-section { font-family:system-ui,sans-serif; font-size:21px; font-weight:700; fill:#0f172a; }
      .dep-label { font-family:system-ui,sans-serif; font-size:17px; font-weight:700; fill:#0f172a; }
      .dep-text { font-family:system-ui,sans-serif; font-size:15px; fill:#1e293b; }
      .dep-small { font-family:system-ui,sans-serif; font-size:15px; fill:#334155; }
      .dep-micro { font-family:system-ui,sans-serif; font-size:13px; fill:#475569; }
      .dep-blue { fill:#1d4ed8; }
      .dep-green { fill:#047857; }
      .dep-amber { fill:#b45309; }
      .dep-purple { fill:#6d28d9; }
      .dep-magenta { fill:#be185d; }
      .dep-solid { fill:none; stroke:#1d4ed8; stroke-width:3; marker-end:url(#arrow-solid); }
      .dep-theorem-arrow { fill:none; stroke:#6d28d9; stroke-width:3.2; marker-end:url(#arrow-theorem); }
      .dep-diagnostic-arrow { fill:none; stroke:#b45309; stroke-width:2.7; stroke-dasharray:9 6; marker-end:url(#arrow-diagnostic); }
      .dep-provenance-arrow { fill:none; stroke:#64748b; stroke-width:2.4; stroke-dasharray:3 6; marker-end:url(#arrow-provenance); }
    </style>
  </defs>

