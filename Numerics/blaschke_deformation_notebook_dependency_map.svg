  <path class="dep-diagnostic-arrow" d="M985 1298 H1025"/>
  <path class="dep-diagnostic-arrow" d="M765 1165 V1190"/>

  <rect class="dep-band" x="40" y="1415" width="1515" height="360" rx="8"/>
