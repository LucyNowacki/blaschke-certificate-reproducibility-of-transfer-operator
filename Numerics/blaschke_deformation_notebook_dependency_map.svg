  <text class="dep-label" x="78" y="1274">Inputs</text>
  <text class="dep-small" x="78" y="1299">Phase 1 raw spectral error tables</text>
  <text class="dep-small" x="78" y="1324">Phase 2 certified row and geometric bases</text>
