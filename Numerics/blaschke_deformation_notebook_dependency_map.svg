  <text class="dep-label" x="1018" y="344">Executable inline-module bootstrap</text>
  <text class="dep-small" x="1018" y="368">Cells 11M--12N install visible helper source by SHA-256</text>
  <path class="dep-provenance-arrow" d="M1040 217 V265"/>

  <rect class="dep-phase1" x="40" y="445" width="1515" height="220" rx="7"/>
  <text class="dep-section dep-blue" x="60" y="478">Phase 1: raw Legendre--Gauss transfer spectra, Cells 13M--35N</text>
  <rect class="dep-cell" x="60" y="498" width="355" height="130" rx="5"/>
  <text class="dep-label" x="78" y="524">Inline mathematical helper</text>
  <text class="dep-small" x="78" y="550">Cells 13M--14N</text>
  <text class="dep-small" x="78" y="574">mpmath_pf_raw.py</text>
  <text class="dep-micro" x="78" y="600">inverse branches, transfer weights and</text>
  <text class="dep-micro" x="78" y="620">Legendre--Gauss block assembly</text>
  <rect class="dep-cell" x="455" y="498" width="555" height="130" rx="5"/>
  <text class="dep-label" x="473" y="524">Computational chain</text>
  <text class="dep-small" x="473" y="550">15N--21N: map, exact targets and branch geometry</text>
  <text class="dep-small" x="473" y="574">24N--30N: N and M sweeps, matching and heatmaps</text>
  <text class="dep-small" x="473" y="598">30AN helper; 30BN recreates retained Phase 1 data</text>
  <text class="dep-micro" x="473" y="620">31N--35N present diagnostics, selected row and gauges.</text>
  <rect class="dep-data" x="1050" y="498" width="485" height="130" rx="6"/>
  <text class="dep-label" x="1068" y="524">Persisted Phase 1 datasets</text>
  <text class="dep-small" x="1068" y="550">raw_spectrum_square_N_sweep*.csv and parquet</text>
  <text class="dep-small" x="1068" y="574">phase1_eigencloud_*.csv and parquet</text>
  <text class="dep-small" x="1068" y="598">phase1_raw_NM_heatmap_data_near_square.*</text>
  <text class="dep-micro" x="1068" y="620">plus Phase 1 figures under outputs/.../figures</text>
  <path class="dep-solid" d="M415 563 H450"/>
  <path class="dep-solid" d="M1010 563 H1045"/>
  <path class="dep-solid" d="M760 415 V440"/>

  <rect class="dep-phase2" x="40" y="695" width="1515" height="470" rx="7"/>
  <text class="dep-section dep-green" x="60" y="728">Phase 2: clean-room single-space deterministic certificate, Cells 35AM--64M</text>
