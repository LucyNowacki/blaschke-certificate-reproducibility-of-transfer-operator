#### The two complete-circle moat routes and their transport

For every rational circle $\Gamma=\{c+\delta e^{i\theta}:0\le\theta\le2\pi\}$, strict Arb comparisons of the exact-dyadic Schur diagonal determine inside/outside membership.  Since $T^\circ$ is upper triangular, the number of diagonal entries inside, with repetitions, is its algebraic Riesz rank.  This is the count route for all twenty-four contours.

For the first seventeen contours, the moat route uses the exact complete-circle diagonal distances
$$
d_i=\bigl||t_{ii}^\circ-c|-\delta\bigr|
$$
and certified row and column triangular recurrences.  If their maxima are $R_\infty$ and $R_1$, then
$$
\sup_{z\in\Gamma}\|(zI-T^\circ)^{-1}\|_2
\le\sqrt{R_1R_\infty},
\qquad
\underline s_\Gamma^{\mathrm{route}}
\ge\frac1{\sqrt{R_1R_\infty}}.
$$
This covers every point of the circle algebraically; it is not interpolation between sampled singular values.

For the final seven contours, samples of the binary64 Schur resolvent merely propose a finite Laurent inverse
$$
C(w)=\sum_{k=k_-}^{k_+}C_kw^k,
\qquad |w|=1.
$$
The proposed coefficient matrices are then frozen as exact dyadic matrices and the residual coefficients in
$$
I-C(w)\bigl((c+\delta w)I-T^\circ\bigr)
=\sum_\ell R_\ell w^\ell
$$
are recomputed in Arb.  With outward upper sums
$$
C_\Gamma^{\mathrm F}=\sum_k\|C_k\|_{\mathrm F},
\qquad
\Delta_\Gamma^{\mathrm F}=\sum_\ell\|R_\ell\|_{\mathrm F}<1,
$$
the Neumann argument gives the complete-circle lower moat
$$
\underline s_\Gamma^{\mathrm{route}}
\ge\frac{1-\Delta_\Gamma^{\mathrm F}}{C_\Gamma^{\mathrm F}}.
$$
The samples choose a candidate; the exact-dyadic residual sum below one is the theorem gate.  Laurent arithmetic never supplies a count.

Either selected route is transported through the same chain
$$
\underline s_\Gamma^{\mathrm{sur}}
=\frac{\underline s_\Gamma^{\mathrm{route}}}{\widehat\kappa_Q},
\qquad
\underline s_\Gamma^\circ
=\underline s_\Gamma^{\mathrm{sur}}-\eta_{\mathrm{Schur}},
$$
$$
\underline s_{\Gamma,600}^{\mathrm H}
=\underline s_\Gamma^\circ-\eta_A.
$$
The two strict positivity tests certify that the Schur count survives first to $A_{600,610}^{X,\circ}$ and then to the mathematical matrix $A_{600,610}^{X}$.  The finite-rank lift is unitarily equivalent to $A_{600,610}^{X}\oplus0$, so its silent complement contributes the exact distance
$$
d_{\Gamma,0}=\inf_{z\in\Gamma}|z|=|c|-\delta>0
$$
for these positive real-centred circles.  The certified lifted moat and resolvent factor are
$$
\underline s_{\Gamma,600}^{\mathrm{lift}}
=\min\{\underline s_{\Gamma,600}^{\mathrm H},d_{\Gamma,0}\},
\qquad
\overline{\mathfrak m}_{\Gamma,600}^{\mathrm H}
=\frac1{\underline s_{\Gamma,600}^{\mathrm{lift}}}.
$$
Finally, Cell 107N evaluates the outward upper small-gain product
$$
