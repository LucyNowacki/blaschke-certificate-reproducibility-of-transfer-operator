#### Why lower displays round down and upper displays round up

A certified lower endpoint remains safe only when its decimal display is no larger than the underlying lower bound; therefore `_directional_endpoint_text(..., bound="lower")` uses decimal floor rounding.  A certified upper endpoint remains safe only when its display is no smaller than the underlying upper bound; therefore the upper route uses decimal ceiling rounding.  Ordinary round-to-nearest could cross the certified endpoint and turn a safe displayed inequality into an unjustified one.  The eight-significant-digit per-row columns and the minimum-moat aggregate obey this rule.  For the maximum-gain aggregate, the retained `2.033128947087571e-7` line is explicitly historical; the current CSV requires the corrected outward display `2.033128947087573e-7`.

#### Laurent source reconstruction and the exact meaning of provenance-only

The seven Laurent proposal sizes are $44,36,48,48,36,40,48$ for $\mu^5,\alpha^{14},\alpha^{15},\alpha^{16},\mu^6,\alpha^{17},\alpha^{18}$.  Their sum is
$$
44+36+48+48+36+40+48=300.
$$
Each proposal produces that many $600\times600$ coefficient matrices.  They are transient because they are reconstructed during the recorded run, frozen and validated as exact dyadic candidates, used to form the rigorous coefficient and residual sums, and then represented by compact witness records rather than required as pre-existing tensor inputs.

For each witness, `coefficient_sha256` is also compared with a historical reference digest.  `Historical Laurent tensor digest parity: all seven` means that all seven reconstructed byte sequences equal those recorded earlier.  This is a chain-of-custody and reproducibility fact only.  The theorem gate uses
$$
\Delta_\Gamma^{\mathrm F}<1,
\qquad
\underline s_\Gamma^{\mathrm{route}}
\ge\frac{1-\Delta_\Gamma^{\mathrm F}}{C_\Gamma^{\mathrm F}},
$$
together with the Schur count, the two matrix transports, the zero-block distance and small gain.  It never uses the proposition `new digest = historical digest`.  Consequently:

- a matching digest with a failed exact-dyadic residual or failed small-gain inequality would not certify the theorem;
- a different newly reconstructed digest could still certify the theorem if its exact-dyadic coefficients passed every mathematical gate, although historical reproducibility would then fail;
- the code records `digest_used_in_theorem_gate = False` and tests that no digest flag can enter `theorem_certified`.

That is the precise meaning of `provenance-only, not a theorem gate`.

Starting from an empty output directory does not ask the digest to prove the result.  The source workflow rebuilds the Phase 2 envelope, mathematical Hardy matrix, exact-dyadic Schur surrogate and all seven Laurent candidates, and then recomputes every count, residual, moat, transport and small-gain inequality.  The theorem certificate is accepted only from those newly checked inequalities.  Digest parity is evaluated separately as historical-reconstruction evidence.  A digest match cannot rescue a failed mathematical gate; conversely, a newly reconstructed witness with different bytes could still prove a moat if all exact-dyadic and Arb gates passed, although historical reproducibility would then be reported as failed and investigated.

#### What is proved, what is hybrid, and what is not proved

**Proved at theorem level.**  The chapter proves the general implications: exact-dyadic Schur membership gives the finite algebraic count; either complete-circle route gives a resolvent moat; positive Schur and matrix-replacement margins transport the count to the mathematical Hardy block; the silent zero block changes the lifted moat to the minimum with $d_{\Gamma,0}$; and strict small gain transports the finite Riesz rank to the exact operator.

**Certified numerically for this fixed run.**  Arb and exact-dyadic arithmetic verify every premise of that chain for $\mu=0.3$, $N=600$, $M=610$, the displayed $(\rho,r)$, and the twenty-four fixed pairwise-disjoint rational circles.  The numerical certificate therefore supplies computer-assisted proof, within the mathematical model and stated implementation assumptions, that
$$
\operatorname{rank}\Pi_{\Gamma_j}(\mathcal L)=1
\quad\hbox{for }\alpha^j, 1\le j\le18,
$$
$$
\operatorname{rank}\Pi_{\Gamma_j}(\mathcal L)=2
\quad\hbox{for }\mu^j, 1\le j\le6,
$$
and that the twenty-four disjoint nonzero contours contain total algebraic multiplicity $30$.

**Hybrid rather than purely numerical.**  The local contour proof establishes ranks inside the fixed circles.  Identifying the enclosed exact spectral points with the names $\alpha^j$ and $\mu^j$, adding the exact simple eigenvalue $1$, and proving that every remaining nonzero point lies inside the $\alpha^{19}$ tail threshold use the external exact Blaschke spectral formula and compactness theory.  Thus the exterior classification is theorem plus external spectral identification, not an output of the contour arithmetic alone.

**Not proved by this output.**  It does not prove that a sampled minimum is a complete-contour lower bound; sampled profiles and progress messages are diagnostic.  It does not compute the exact singular-value minima or show that the certified bounds are sharp.  It does not prove continuous global optimality of $(\rho,r)$ beyond the fixed certified design.  It does not derive the exact packet centres or the entire infinite spectrum from finite numerics alone.  It does not prove an asymptotic convergence rate from the single $N=600$ row.  It does not prove equality of unknown exact candidate norms merely because two upper endpoints agree.  Finally, digest parity authenticates historical candidate bytes but proves no invertibility, moat, count, or Riesz-rank statement.

The seven adversarial checks in Cell 106N support this separation by forcing count, moat, Schur replacement, Hardy replacement, silent-zero, source-provenance, and small-gain failures independently.  They test that the implementation fails closed; they do not replace the mathematical propositions or the certified arithmetic performed by Cell 107N.  This Markdown explanation likewise interprets the retained certificate and does not itself add a theorem gate.'''
