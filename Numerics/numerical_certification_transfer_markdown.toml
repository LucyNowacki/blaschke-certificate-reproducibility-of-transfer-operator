=\varepsilon_{600,610}^{\sharp}
 \overline{\mathfrak m}_{\Gamma,600}^{\mathrm H}
=\frac{\varepsilon_{600,610}^{\sharp}}
       {\underline s_{\Gamma,600}^{\mathrm{lift}}}
<1.
$$
The Neumann factorisation then keeps every shifted exact operator invertible along the finite-to-exact homotopy, so the exact operator and the finite lift have the same Riesz rank inside $\Gamma$.

