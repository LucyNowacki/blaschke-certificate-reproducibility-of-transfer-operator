[entries."5d43e2ec"]
code_cell_ids = ["9b8c4f29"]
chapter_labels = ["subsec:numerics-three-gauges", "eq:numerics-coordinate-chain", "eq:numerics-pure-r-gauge-matrix", "eq:numerics-X-gauge-matrix"]
evidence_status = ["empirical_diagnostic"]
heading_from = "## Mathematics for Cell 18"
heading_to = "## Mathematics for finite coordinate Cell 35N"
mathematics = '''For one $f\in V_N$, ordinary Legendre coefficients $c$ become pure-scaled coefficients $y=D_{r,N}c$ and Hardy packet coordinates $d=T_N(r)y$.  The synthesis map is chosen so that $\|f\|_X=\|d\|_2$.  Hence
$$
L_N^{(r)}=D_{r,N}\widehat L_ND_{r,N}^{-1},\qquad A_N^X=T_N(r)L_N^{(r)}T_N(r)^{-1}.
$$
The matrices are similar and share eigenvalues, but their singular values have different norm meanings.  This floating-point cell illustrates the transform; it is not the validated $N=600$ transport certificate.'''

