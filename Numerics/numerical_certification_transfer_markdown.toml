mathematics = '''The worker evaluates the Perron--Frobenius block
$$
(\widehat L_N^{(M)})_{k\ell}=\sum_{j=1}^M w_j\overline{\widetilde P_k(x_j)}\sum_b\phi_b(x_j)\widetilde P_\ell(\tau_b(x_j))
$$
or, in matrix form, $\widehat L_N^{(M)}=P^*Wh$.  This is the finite transfer operator, not a Koopman matrix.  The helper also diagonalises raw blocks and greedily matches eigenvalues to external targets; those matches measure empirical proximity only and do not supply Riesz ranks or complete-contour moats.'''

